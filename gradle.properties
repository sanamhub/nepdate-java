group=io.github.sanamhub
version=1.0.0-rc.1

org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -Dfile.encoding=UTF-8
org.gradle.caching=true
# The configuration cache is off: Spotless 8.10.4 keeps a task-state list it cannot serialise, and a
# build that fails on caching has no benefit. ADR-0001 records the choice.
org.gradle.configuration-cache=false

# The line-coverage floor of ADR-0004 gate 3, read by build.gradle.kts. Set here rather than in the
# build script so the same number drives the local run and CI.
nepdateCoverageMinimum=0.90

# PIT thresholds for :nepdate-java (ADR-0010). The first full run scored 746 detected of 818
# mutants (91%) with 72 missed, so the gate sits one point below the score and at the measured
# missed count. docs/mutation/equivalent.md records the run and the statuses.
nepdateMutationThreshold=90
nepdateMaxSurviving=72
