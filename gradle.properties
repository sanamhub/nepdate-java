group=io.github.sanamhub
version=1.0.0-rc.1

org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
# The configuration cache is off: Spotless 8.10.4 keeps a task-state list it cannot serialise, and a
# build that fails on caching has no benefit. ADR-0001 records the choice.
org.gradle.configuration-cache=false

# The line-coverage floor of ADR-0004 gate 3, read by build.gradle.kts. Set here rather than in the
# build script so the same number drives the local run and CI.
nepdateCoverageMinimum=0.90

# PIT thresholds for :nepdate-java (ADR-0010). Filled in from the first full run; see
# docs/mutation/equivalent.md for the mutants that cannot be killed.
nepdateMutationThreshold=0
nepdateMaxSurviving=0
