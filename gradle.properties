group=io.github.sanamhub
version=1.0.0-rc.1

org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=96m -Dfile.encoding=UTF-8
org.gradle.caching=true
# The configuration cache is off: Spotless 8.10.4 keeps a task-state list it cannot serialise, and a
# build that fails on caching has no benefit. ADR-0001 records the choice.
org.gradle.configuration-cache=false

# The line-coverage floor of ADR-0004 gate 3, read by build.gradle.kts. Set here rather than in the
# build script so the same number drives the local run and CI.
nepdateCoverageMinimum=0.90

# PIT thresholds for :nepdate-java (ADR-0010). The last full run scored 803 detected of 823
# mutants (97%) with 20 missed and no uncovered mutant, so the gate sits one point below the score
# and at the measured missed count. docs/mutation/equivalent.md records the run and every survivor.
nepdateMutationThreshold=96
nepdateMaxSurviving=20

