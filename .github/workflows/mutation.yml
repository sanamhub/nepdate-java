# Mutation testing (ADR-0010). It runs on a pull request that changes the core or its tests, weekly,
# and by hand. The per-row vector classes are excluded from the PIT run, so a pull request run takes
# a few minutes rather than the full suite repeated for every mutant.
name: mutation

on:
  pull_request:
    paths:
      - "nepdate/src/main/**"
      - "nepdate/src/test/**"
      - "nepdate/build.gradle.kts"
      - "scripts/mutation.sh"
      - "scripts/test-mutation.sh"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: The gate's own controls
        run: ./scripts/test-mutation.sh
      - name: PIT on the core
        run: ./scripts/mutation.sh
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: nepdate/build/reports/pitest/
          if-no-files-found: ignore
          retention-days: 7
